[project]
name = "ppnckh"
version = "0.1.0"
description = "Đồ án / báo cáo: ML dự đoán tiểu đường (Pima) — notebook khớp main.tex"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "jupyterlab>=4.0",
    "ipykernel>=6.25",
    "joblib>=1.3",
    "scipy>=1.11",
]

[project.optional-dependencies]
shap = ["shap>=0.43"]
